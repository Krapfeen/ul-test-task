name: ${APP_NAME}

services:
    postgres:
        container_name: ${APP_NAME}-db
        image: postgres:15
        environment:
            POSTGRES_DB: ${APP_NAME}
            POSTGRES_USER: ${APP_USER}
            POSTGRES_PASSWORD: ${APP_PASSWORD}
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U notify"]
            interval: 5s
            timeout: 5s
            retries: 5

    redis:
        image: redis:alpine
        container_name: ${APP_NAME}-redis
        ports:
            - "6379:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 5

    app:
        build: .
        container_name: ${APP_NAME}
        volumes:
            - .:/var/www
        depends_on:
            - postgres
            - redis
            - rabbitmq
        environment:
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: ${APP_NAME}
            DB_USERNAME: ${APP_USER}
            DB_PASSWORD: ${APP_PASSWORD}
            REDIS_HOST: redis
            RABBITMQ_HOST: rabbitmq
            RABBITMQ_PORT: 5672
            RABBITMQ_USER: ${APP_USER}
            RABBITMQ_PASSWORD: ${APP_PASSWORD}
        ports:
            - "9000:9000"

    webserver:
        image: nginx:alpine
        container_name: ${APP_NAME}-nginx
        ports:
            - "8080:80"
        volumes:
            - .:/var/www
            - ./.docker/nginx.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app

    rabbitmq:
        image: rabbitmq:3.12-management
        container_name: ${APP_NAME}-rabbitmq
        ports:
            - "5672:5672"
            - "15672:15672"
        environment:
            RABBITMQ_DEFAULT_USER: ${APP_USER}
            RABBITMQ_DEFAULT_PASS: ${APP_PASSWORD}
        healthcheck:
            test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - default

volumes:
    pgdata:
        name: ${APP_NAME}_db
